<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oana</title>
<style>
:root{--g:#39ff14;--bg:#020402}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--g)}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.35}
.wrap{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:1rem}
pre{margin:0;font-size:clamp(7px,2.6vw,26px);line-height:1.05;white-space:pre;text-shadow:0 0 6px var(--g),0 0 18px var(--g);position:relative}
pre.g::before,pre.g::after{content:attr(data-t);position:absolute;inset:0;white-space:pre}
pre.g::before{color:#ff2bd6;transform:translate(-3px,0);clip-path:inset(10% 0 55% 0);mix-blend-mode:screen;text-shadow:none}
pre.g::after{color:#00e5ff;transform:translate(3px,0);clip-path:inset(60% 0 8% 0);mix-blend-mode:screen;text-shadow:none}
.sub{margin-top:1.6rem;font-size:clamp(12px,2vw,18px);letter-spacing:.3em;text-transform:uppercase;animation:flick 3s infinite}
.sub b{display:inline-block;width:.6em;background:var(--g);animation:blink 1s steps(1) infinite}
.scan{pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.scan::after{content:"";position:absolute;left:0;right:0;height:18%;top:-20%;background:linear-gradient(transparent,rgba(57,255,20,.07),transparent);animation:sweep 6s linear infinite}
@keyframes sweep{to{top:110%}}
@keyframes blink{50%{opacity:0}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.3}95%{opacity:.9}97%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.sub,.scan::after{animation:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <div>
    <pre id="art" class="g" aria-label="Hi, I am Oana"></pre>
    <div class="sub">hi, i am oana<b>&nbsp;</b></div>
  </div>
</div>
<div class="scan"></div>
<script>
const src=String.raw`    __  ___       ____                 
   / / / (_)     /  _/  ____ _____ ___ 
  / /_/ / /      / /   / __ '/ __ '__ \
 / __  / /_    _/ /   / /_/ / / / / / /
/_/ /_/_/( )  /___/   \__,_/_/ /_/ /_/ 
         |/                            

   ____  ___    _   _____ 
  / __ \/   |  / | / /   |
 / / / / /| | /  |/ / /| |
/ /_/ / ___ |/ /|  / ___ |
\____/_/  |_/_/ |_/_/  |_|
                          `;
const pre=document.getElementById("art");
const chars="#@%&$*+=<>/\\|!?01░▒▓";
function render(g){
  let out="";
  for(const ch of src){
    if(ch!==" "&&ch!=="\n"&&Math.random()<g) out+=chars[Math.random()*chars.length|0];
    else out+=ch;
  }
  pre.textContent=out; pre.dataset.t=out;
}
render(0);
// initial decode animation
let n=0,boot=setInterval(()=>{render(Math.max(0,1-n/22));if(++n>24){clearInterval(boot);render(0)}},50);
// random glitch bursts
(function loop(){
  setTimeout(()=>{
    let k=0,iv=setInterval(()=>{
      render(.06+Math.random()*.12);
      pre.style.transform=`translate(${(Math.random()-.5)*10}px,${(Math.random()-.5)*4}px) skewX(${(Math.random()-.5)*8}deg)`;
      if(++k>5+Math.random()*6){clearInterval(iv);pre.style.transform="";render(0)}
    },60);
    loop();
  },1200+Math.random()*2800);
})();
// matrix rain
const c=document.getElementById("rain"),x=c.getContext("2d");
let cols,drops,fs=16;
function size(){c.width=innerWidth;c.height=innerHeight;cols=Math.ceil(c.width/fs);drops=Array.from({length:cols},()=>Math.random()*-50)}
size();addEventListener("resize",size);
const glyphs="0123456789ABCDEFOANA<>/\\|+=*#";
setInterval(()=>{
  x.fillStyle="rgba(2,4,2,.12)";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#39ff14";x.font=fs+"px monospace";
  for(let i=0;i<cols;i++){
    x.fillText(glyphs[Math.random()*glyphs.length|0],i*fs,drops[i]*fs);
    if(drops[i]*fs>c.height&&Math.random()>.975)drops[i]=0;
    drops[i]+=.6;
  }
},50);
// glitch on click / touch
addEventListener("pointerdown",()=>{let k=0,iv=setInterval(()=>{render(.35);if(++k>8){clearInterval(iv);render(0)}},45)});
</script>
</body>
</html>
