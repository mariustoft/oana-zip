<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#060608;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#scene{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;perspective:1000px;perspective-origin:50% 50%}
canvas{position:absolute;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;cursor:crosshair;backface-visibility:hidden}
#r,#d{visibility:hidden;pointer-events:none}
.scan{pointer-events:none;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px)}
h1{position:absolute;left:-9999px}
.vig{pointer-events:none;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.8))}
/* ---- poems view: the list of Oana's poems, built from characters, scrolling inside its own container ---- */
#pv{position:fixed;left:0;top:0;right:0;bottom:0;z-index:5;--h:280;--s:85%;--tf:Georgia,serif;--tw:400;--tst:normal;--bf:Georgia,serif;--bk:1;--bs:clamp(17px,4.6vw,19px)}
#pv[hidden]{display:none}
#pv .shade{position:absolute;top:0;bottom:0;left:50%;width:min(100%,calc(62 * .55 * var(--bs) + 40vw));transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,rgba(6,6,8,0),rgba(6,6,8,.74) 22%,rgba(6,6,8,.8) 50%,rgba(6,6,8,.74) 78%,rgba(6,6,8,0));opacity:0;transition:opacity .5s ease}
#pv.on .shade{opacity:1}
#pvs{position:absolute;left:0;top:0;right:0;bottom:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  scrollbar-width:thin;scrollbar-color:hsla(var(--h),30%,70%,.22) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent calc(env(safe-area-inset-top,0px) + 30px),#000 calc(env(safe-area-inset-top,0px) + 96px),#000 calc(100% - 90px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,transparent calc(env(safe-area-inset-top,0px) + 30px),#000 calc(env(safe-area-inset-top,0px) + 96px),#000 calc(100% - 90px),transparent 100%)}
#pvs::-webkit-scrollbar{width:3px}#pvs::-webkit-scrollbar-track{background:transparent}#pvs::-webkit-scrollbar-thumb{background:hsla(var(--h),30%,70%,.22);border-radius:3px}
#pv .col{box-sizing:content-box;max-width:calc(62 * .55 * var(--bs));margin:0 auto;font-size:var(--bs);
  padding:calc(env(safe-area-inset-top,0px) + 84px) max(20px,env(safe-area-inset-right,0px)) calc(48vh + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  opacity:0;transition:opacity .35s ease}
#pv.on .col{opacity:1}
#pv .pm{margin:0}
#pv .pt{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:.55em;width:100%;min-height:44px;padding:9px 0 9px;cursor:pointer;
  font-family:var(--tf);font-weight:var(--tw);font-style:var(--tst);font-size:clamp(18px,5.1vw,22px);line-height:1.32;text-transform:none;letter-spacing:.01em;
  color:hsla(var(--h),calc(var(--s) * .3),76%,.5);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;

<script type="application/json" id="poems-data">[{"title":"Aici Ma Simteam Bard Din Evul Mediu Sau Cv","body":"I'm a jester that performs,\nNothing less and nothing more\nI'm an artist and my purpose\nIs to entertain your soul.\n\nJust an empty shell I am,\nAnd I've got stories to tell,\nI'm not speaking but a muse\nAnd I'm here to amuse.\n\nI am acting for the masses,\nUntil the whole world collapses\n'Cause Rome fell and so did Greece\nBut I'm still playing my piece.\n\nBecause artists, we don't die\nWe play dramas and sing lies,\nWe are made the Gods to please\nAnd we're doing it with ease."},{"title":"Aici Sufeream Sau Cv","body":"Contemptuous attitude towards cannibalism.\nI love taboos. Dissecting human beings.\nLet me caress your spleen.\nAllow me to take a bite of your kidney.\nTo devour your brain and consume your heart.\nGive me permission to kill you and feed on you.\nUntil you vanish out of this ephemeral world.\nLet's be one. Forever.\nEternal."},{"title":"Poezia Romaneasca","body":"Care mă duce la birt\n\nPoezia românească\nNu poate fi înțeleasă\nDecât după ce ai la bord\nMăcar 50 de Smirnoff.\n\nPoezia"},{"title":"Ca Geniul Poetic","body":"Ca geniul poetic\nAm vrut să văd dacă-mi găsesc idealul în iubire\nSpre marea mea dezamăgire\nNu.\nPentru că nu-i nimeni care să intre\nÎn standardele frivole\nAle unui om\nCe caută perfecțiune.\n\nE o tâmpenie să zic\nCă m-am îndrăgostit de un ideal\nȘi acum mi se pare banal\nTot ce-i uman.\n\nSunt obsedată\nDe ceva ce nici măcar serafii nu cunosc\nVreau să iubesc\nCum Dumnezeu iubește omul\nO prostie-\nȘi cred că-i zice blasfemie."},{"title":"Am Incercat Sa Iubesc","body":"Am încercat să iubesc,\nfără să aștept nimic în schimb\nși mi-am dat seama rapid\ncât de\nobsesiv\nsună\nîntrebarea:\n\"Hey, de ce nu mi-ai spus 'bună'\nexact când te-ai trezit?\"\nPentru tine poate nu-nseamnă nimic,\nun gest kitschos\ndar pentru mine,\nchiar ș-un emoji de la tine\nînseamnă tot.\n\nAș vrea să vorbim\nde parcă ne știm\nde o eternitate.\nDar totuși,\nnu vreau doar vorbe,\nvreau și fapte\nȘi vreau,\nvreau să îmi zici\ncă totul o să fie bine.\nCă tu mă vrei doar pe mine.\n\nAș vrea să am siguranța\ncă nu mă voi sinucide\nîntr-o seară de 17 august,\nascultând piese insipide\nși citind în continuare\ncărțile lui Proust.\nAș vrea să am certitudinea\nfericirii și\nși aș vrea să nu mă tem\ncă fac un AVC\nși mă duc dracului\nfără să dau un semn.\nAș vrea să nu mă mai consum\ncu toți proștii,\ncare n-au făcut o școală\ndar au păreri\ncare mă bagă-n boală\nși care\ncare nu înțeleg în pula mea\nla ce e bun un psiholog\nși de ce simt că o iau randeaua.\n\nȘi aș vrea liniște."},{"title":"Iubire","body":"Iubire.\nEufemism prozaic\npentru\nsuferință, durere\nși\nși alte cele.\nE oare prea excentric\nsă cred că\nnenorocitul, fantasticul\nOrfeu\nnu este emeritul în iubire\nci sunt eu?\nAm credința asta\nproastă,\ncă iubirea omenească\ne ca stelele în firmament.\n\nReprezentare iluzorie negată vehement."},{"title":"Place Prea Mult Poezia","body":"plă e prea mult poezia\nca să mai țin cont\ncă imit calomnia\nși că\nnimeni nu mai citește\nversuri fără pont.\n\nNu am un punct\nanume\nunde vreau s-ajung,\ndar parc-aș sta\ndeasupra,\nn-aș vrea să mă afund,\nsă scriu maculatură de duzină\ncând societatea deja e arhiplină\nde vorbe fără noimă,\naberații și\ndoctrine și\nși\n\"mamă ce le dai în rime.\"\n\nNu e că vreau s-obțin\ndar e că vreau să las,\nnu e că vreau să fie\ndar de vor fi rămas\n\nmăcar 3 idei\nș-un vers\nștiu că toată\ntruda\nmă chinuie c-un sens."},{"title":"Terminati Cu Prostiile","body":"Terminați cu prostiile\nși epifaniile\nși\naerele de artiști,\nvrăjeala că sunteți triști,\nși d-aia,\nd-aia voi nu faceți poezie\nvoi\n\"puneți din suflet pe hârtie.\"\n\nMâncați căcat de-a-n pulea,\nscuzați limbaju',\nda' să mor de nu-i aiurea\ncum consumă lumea\njocuri de cuvinte,\ntâmpite,\ngen \"tine\" rimează cu \"mine\"\nși zic ăștia:\n\"Ce bine!\ntipu' ăsta chiar simte!\"\n\nSimțiți pe dracu'...\nnu că aș scrie eu opere de\ncenaclu\ndar măcar scriu sincer\n\nși onest,\np-ăștia numa' după bani\ntot \"din suflet\" vă detest."},{"title":"Hxq917","body":"Elocvent și samavolnic\nPseudo-martir bicisnic\nÎn tumultul macrocosmic\nEfemer geniu liric.\nBiet copil cu insomnii\nAre-n somn paralizii\nCu viziuni și profeții\nHarul beatitudinii.\nIntrospectând stigmatizat\nSacrosanct emancipat\nInstinctiv premeditat\nChip mesiatic emfazat.\nNu a uitat, nu va uita\nToată truda și sforțarea\nConștiinței colective\nEfectul gloatei primitive."},{"title":"Zhr34Q61","body":"Poezia e o\npleșcăviță sârbească de cuvinte,\ndacă mi se permite.\nUn fel de\nmaterie neagră\ncare se propagă\nefectiv peste tot\nși ne stresează.\nVrem s-o înțelegem.\nCe e poezia, de fapt?\nObiect psiho-social abstract.\nCe e aia?\nUn căcat frapant,\ncă ne sperie ce nu înțelegem\nși noi nu înțelegem nici măcar\nce-i așa terifiant."},{"title":"Alta Blasfemie","body":"Nu am nevoie\nde\nvalidarea unui\nerudit\ncând eu doar spun\nce vreau\nce văd\nce simt.\nSă dezbat\ndacă\npoezia mea e poezie?\nE ce vrea ea să fie.\nE\nun strigăt,\nun urlet,\nun răcnet.\nE cutia Pandorei,\ndar deschisă demult.\nO Fecioara Maria\ndupă ce a născut."},{"title":"Fa Sa Va Explic Aesthetic Ul Meu","body":"Fă,\nsă vă explic aesthetic-ul meu\ne la fel de greu\ncum e să îi explici mă-tii\ncine e Character.AI\nși de ce ți-a spus\ncă te iubește."},{"title":"Mi Am Format Un Tabiet","body":"Mi-am format un tabiet\nascultând\nmuzică proastă,\ncitind literatură rusească\nși plângând.\nS-ar zvârcoli\nPushkin\nîn groapă\ndacă ar știi\ncă ascult Megadeth\nși-i citesc din poezii."},{"title":"Paraclis","body":"Paraclis.\nMaica Precista iartă-mă\ncă nu-s nici fariseu\nnici vameș.\nSunt un nici nu mai știu ce,\nun talmeș-balmeș\nde păcate\nadunate.\nSunt Iuda l-a-nghițit cumva pe Toma\ndar și Iona.\nSodoma și Gomora mă cuprind\nși mă pierd și mă înec\nîntr-un ocean de perfidie.\nEuforie,\ncând ard în lad\no veșnicie."},{"title":"Am I Just A Jester","body":"Am I just a jester\nWho performs for the Gods?\nAnd if I am so mighty,\nWhere are my regards?\n\nThey said I made a pact,\nA Faustian bargain.\nWith the devil himself,\nFor talent. Just a grain.\n\nMight I be just a fool\nWho entertains the Holy?\nAnd if I'm truly so,\nWhere would be all my glory?\n\nThey said I'm just a vessel,\nA voice used by the muses.\nA way to spread a gospel,\nA madman who amuses."},{"title":"E Greu Sa Fii Femeie","body":"E greu să fii femeie\nși să faci poezie.\nOrice am scrie\neste\ntratat\ncu superficialitate.\nȘi scriem mult,\nși bine,\ndar suntem\nignorate\nși suntem\natacate\nde bărbați\ncare\nnici nu au talent\ndar au alți bărbați\nîn spate."},{"title":"Sarut Postmortem","body":"Sărut postmortem.\nȘtiu că e\nimoral\nsă fii atras\nde\nrigor mortis,\ndar ce-i acum\nși-atunci n-a fost\nnu mă încântă,\ncăci vreau\nce-a fost\nși\nce-a fost\nacum se uită.\nSau diferență\nva să fie\nîntre cadavru\nși stafie?\nOri ce-i trupesc-\nnelegiuire\nși doar în spirit\npoți...\niubire?"},{"title":"Sentinta","body":"Sentință.\nBiciuit să fiu\ndacă-i nelege\nsă iubesc\nprostesc,\nce inima alege.\nȘi să mă jupuiți,\ncând mai naiv din fire\ndau tot\nși bani\nși aur\nca să obțin iubire.\nȘi să mă schingiuiți,\ndacă pic în ispită\nși uit tot ce cunosc\npentru a mea iubită."},{"title":"Moments","body":"Moments.\nTime passes(?)\nand\nit feels like\nI am\ntrapped\nin a spider web.\nCaught\nin a\nneverending\nforeign land\nand,-\nand it feels\nlike\nI've passed\nthrough\nthe veil\nto no avail.\nVain,\nreaching the\nrealm\nof fae.\n\nFor I am human, and no fae. For dust I am and to\ndust I shall return."},{"title":"Gyiyr6","body":"E oare prea obscen\ndacă as presupune\nca nu mai este nimeni\nla fel ca tine\nîn lume?\nAtât de diferiți,\naș vrea să-ți spun\nnemesis.\nPentru că eu detest\ncât de tu poți fi.\nȘi cât de tu\nsunt eu\nnu-ți poți închipui.\nE oare asta soarta\ncare deschide poarta\nși care-n mine primește\nce nu știu că-mi priește?\nSau să îi zic destin\ncare în chip hain\nscoate ce am în mine\nca să am loc\nde tine?"},{"title":"Poezia Feminista","body":"Poezia feministă\nCel mai bine este scrisă\nDe-un bărbat de vârsta a treia\nCare i-a plecat femeia."},{"title":"Ar Fi O Calomnie","body":"Ar fi o calomnie\nsă-mi zici că am talent.\nȘi ar fi blasfemie\nsă-mi spui că sunt poet.\nȘi spectacol de teatru\ndacă ți s-ar părea\ncă prin ceea ce scriu\naș vrea să spun ceva.\n\nDoar un bufon eu sunt,\ncare cu poezia\nare un singur scop-\nsă-și arate prostia.\n\nZâmbește-mi împărate,\naruncă-mi mărunțiș!\nTe rog să râzi de mine,\nnu mă privi pieziș.\nSunt doar un măscărici,\nnu am deci nici o vină\nși tot ceea ce spun\ntu știi că-i doar o glumă."},{"title":"Ma Rog","body":"Mă rog.\nȘi nu m-am mai rugat așa.\nDoamne,\ndacă mă auzi\nrogu-te, nu mă lăsa.\nE ipocrit,\nși mai afurisit\ndin partea mea\ndecât necredința lui Toma.\nDecât trădarea lui Iuda.\nSă-ți cer, Doamne,\ndoar atât te deranjez\ncrucea e grea...\nși te-aș ruga,\nslăvite Tată,\nși doar un gram s-o ușurezi.\nMă frâng și mă frământ sub ea,\nnici Sisif împingând la deal\nnu-i chinuit în așa hal,\ncum mă chinui eu\ncu crucea mea.\ncrucea e grea,\ncrucea e grea,\ncrucea e grea.\nDe ce-i a mea?"},{"title":"Am Venit Pessoa","body":"Am venit Pessoa și am plecat Picasso"},{"title":"Sacrosanct","body":"Sacrosanct.\nCu ochii roșii,\nplânși martiric,\nprivesc cu jind\niconostasul-\ncum Maica-și ține\nla sân Fiul;\nși cu ecou aud\nvozglasul.\nDar o fi preotul\nce cântă\nori aud cetele cerești?\ncăci mii de glasuri\nse îngână,\nși par că-s glasuri\nîngerești.\nPrivesc în sus,\nînspre cupolă,\ncătre Hristos Pantocrator\nDar și-a luat ochii de la mine;\na amuțit sfântul sobor.\nIar sub genunchii-mi chinuiți,\nși-nflăcărați de pietate,\nInfernul însuși s-a deschis.\n\"Lasciate ogni speranza, voi ch'entrate.\""},{"title":"Daca Ti As Da Iubirea Mea","body":"Dacă ți-aș da\niubirea mea\npentru\nnimic,\nci doar așa,\nca să o ai,\nte-ai întoarce înapoi\nsă mi-o redai?\nSau egoist\nși mai hapsân\nai da-o altcuiva\nfără să-ți pese\nde goliciunea mea?\nDacă ca Oedip\nmi-aș scoate ochii\ndar ți i-aș pune-n\npalmă,\noare ți-aș fi mai dragă?\nSau excentric din fire\ni-ai luat fără răgaz\npentru a ta iubire?\n\nDacă ți-aș fi\njumătatea\nși mitul androginului ar\nexista\nm-ai iubi doar pe mine?\nSau oare m-ai tăia\nfără regrete\nși-apoi ți-ai face singur\nun alt\nsuflet pereche?"},{"title":"Tronuri","body":"Confiteor Deo\nOmnipotenti\nBeatae Mariae\nSemper Virgini\nBeato Michaeli archangelo\nSanctis apostolis\nOmnibus sanctis.\n\nRegret.\nMai încape mult regret în mine?\nNu cred...\nPrin răni deschise, purulente,\ncurg în șiroaie remușcări și regrete.\nAți smuls din mine\nși ficatul și splina\nși chirurgical mi-ați extras inima.\nAm încasat atâtea lovituri\nși imploram să nu mai dați\nc-am și eu suflet\nși mă doare\ndar voi nu mă ascultați.\n\nȘi mi-am întors fața către Tatăl\nși m-am rugat\ncum nici Arhanghelii din ceruri\nnu ar fi cutezat.\nMi-am întors fața către Tatăl\nși-am urlat:\nDoamne, auzi strigătul meu disperat.\n\nRex tremendae majestatis,\nQui salvandos salvas gratis,\nSalve me, fons pietatis."},{"title":"Simbioza","body":"Simbioză.\nAm stări febrile\ncând\nte văd.\nEști atât de\nfrumos...\nUn vis lucid\nîntors pe dos.\nEști zburător?\nOri un luceafăr\nprintre stele?\nȘi eu nebună,\nte caut printre ele...\nAș vrea să ne\nunim,\nunul să\ndevenim.\nSă nu fiu eu,\nsă nu fii tu.\nSă fim unul mereu\nîntr-un\nmultivers\nperpetuu.\nSimbioză.\nCu tine ies din abioză."},{"title":"Maledictie","body":"Maledicție.\nSă nu poți scrie niciun vers\nși pururi să te chinui.\nSă scrii doar rânduri fără sens,\ncuvântul să nu-l birui.\nSă fii hulit și clevetit\nși veșnic luat peste picior.\nSă nu poți scrie mai nimic,\ncând scrii, să te cuprindă un fior.\nSă nu ai inspirație și apetență\nși să îți simți sufletul gol.\nSă vrei să scrii cu ardență,\ndar să scrii prost și frivol.\nExcommunicatio major."},{"title":"Nu Stiu Sa Ma Exprim","body":"Nu știu să mă exprim în cuvinte.\nNu am scris niciodată romane,\nnu am pus cuvinte pe hârtie\nși de aceea nu știu cum să exprim\nce-aș vrea să-ți spun eu ție.\n\nNu știu să mă exprim în cuvinte.\nNu am scris niciodată poezie,\nnu mă pricep la versuri sau la rime\nși de aceea nu știu cum să exprim\nce simt eu pentru tine.\n\nNu știu să mă exprim în cuvinte.\nNu am scris niciodată vreo scrisoare,\nnu știu să fac declarații sau să mărturisesc\nși de aceea nu știu cum să exprim\ncă te iubesc."},{"title":"Bacchanal","body":"Călăuzit de Procyon\nși înzestrat de muze\ndau sens cuvintelor\nce-mi freamătă pe buze.\nȘi Bacchanal voi face\nce-i închinat lui Baccus\ncăci latent în mine zace\nun har precum păcatul.\nChinuitor, pizmaș și crunt\ntot răscolește-n mine\nca moartea într-un muribund\nînzestrările-mi divine.\nCând cugetărilor dau glas\nși mă declar Augur,\nsunt luat, legat și pe rug ars\nca un păgân nebun.\nDar eu sunt vocea zeilor,\nsunt ecou de titan,\nsunt tatăl ideilor,\nsunt profet d'antan."},{"title":"Fhyfv7Ty","body":"Agonie.\nNici Prometeu\ncu ficatul fărâmițe\nbrutal consumat\nnu trece prin atâtea suferințe\ncâte am eu de înfruntat.\nMă pierd și mă regăsesc\nîn aceeași gaură de șarpe\ndin care ies în fiecare zi\nși cad iar în fiecare noapte.\nȘi ca Icar,\nnebun și maniac,\naș fi sperat\nsă pun mâna pe soare.\nDar deschid ochii, plâng turbat\niar cad și mă înec în mare.\nRuinele a ce am fost\nse tot dărâmă zi de zi,\nun Colosseum tenebros\nridicat din frustrări și gelozii.\nAm înțeles așa de greu\nce simțea Persefona\nde ce-n Infern plângea mereu\ncând Hades o iubea.\nHomer scria...\n\nNu, stai.\nMă dor plămânii de la plâns\nși capul de la gânduri\nși nu știu dacă am mai spus\ndar d-asta mai scriu rânduri.\nȘi ca s-ascund că am frustrări,\ncă mă urăsc pe mine\nfac rime proaste și postări\nca să pară că-s bine.\nDar noapte când mă pun în pat\ndin nou mă pun pe plâns\niar zbier și urlu și mă zbat\ncă nu sunt de ajuns.\nȘi se adună-n mine ura,\nrâvna, scârba și mâhnirea\nși nu că vreau, dar numai pentru\ncă nu cunosc iubirea."},{"title":"8Gyt57D5F58","body":"Nu știu câtă\nură\nmai încape în mine.\nNu știu dacă-i normal\nsă am frustrări maligne.\nNu știu cum\nși în ce fel\nsă mă deschid\nîn fața ta\ndoar pentru\nnevoia\nde a-mi valida suferința.\nNu știu ce înseamnă să fii bun.\nȘi-am întrebat,\ndar n-am primit răspuns\ndin rugăciuni.\nȘi când mă uit în jur\nși văd\natâta ură necontrolată,\nagresivitatea nefondată,\nciudă generalizată,\nmă întreb:\na fost cineva bun vreodată?\nE clar că\nfiecare cară propria povară.\nSă fie o\nmadea generațională?\nO boală\nfatală."},{"title":"Anatema","body":"Afurisit să-ți fie numele în veci.\nSă crape buzele care-l rostesc.\nȘi oricine îl poartă să nu mai aibă tihnă.\nȘi oricine-l cunoaște să nu aibă odihnă.\n\nNenorocit să fii de-a pururi.\nSă nu-ți poți da iubirea nimănui.\nȘi nimeni să nu îți dea iubire.\nTot ce cunoști să fie doar ură și mâhnire.\n\nSă suferi iar și iar etern.\nSă-ți fie fiecare zi ca în Infern.\nSă ți se pârjolească inima-n dureri\nȘi să renunți la tot. Să nu mai știi să speri.\n\nÎmi doresc...\nNu.\nÎți doresc\nsă ai parte doar de\nChinuri, disperare,\nstrofocări și întristare,\nghinion, boli, nedreptate\nși infecții și chiar moarte.\n\nȘi o viață lungă, ca să treci prin toate."},{"title":"Sa Fie O Chestiune Biblica","body":"Să fie o chestiune biblică\nsă lupți la infinit?\nȘi dacă chiar aș fi arhanghel,\nde ce nu am aripi?\nMă simt deseori, privind spre cer,\nca un albatros rănit.\nOare așa și Lucifer s-o fi simțit?\n\nSă fie o chestiune biblică\nsă treci prin ploi și foc?\nȘi dacă îmi car și eu crucea,\nsunt oare prooroc?\nMă simt deseori, când n-am pe nimeni,\nmizerabil și trist.\nOare asta înseamnă să fii evanghelist?\n\nSă fie o chestiune biblică\nsă îți dorești mai mult?\nȘi dacă obțin ce vreau,\nînseamnă că-s preasfânt?\nMă simt deseori, când am tot ce-mi doresc,\nde parcă nu sunt Eu.\nÎnseamnă asta oare, că aș fi Dumnezeu?"},{"title":"M A Scos Un Gagiu","body":"M-a scos un\ngagiu\nla Kayus\nși mi-a recomandat\nescargot.\nI-am spus că nu-mi prea place,\nchiar dacă eu\nîn general\nmănânc ghiare de găină\nsau picioare de porc.\nMi-am luat un\nrooibos\nfără zahăr,\ndietetic,\nchiar dacă zilnic beau\ncafea la ibric.\nVedeam de pe terasă\nautobuzele care\nlasă\nplebea în Livadă.\nEl m-a adus cu\nG class\nși nu îmi pasă\ncă în rest\nmerg cu șasele\nacasă."},{"title":"Confesiuni","body":"Întotdeauna am fost copilul care\nla orice aniversare\nplângea puțin cam tare.\nAtunci nu știam\ndar cred că o făceam\npentru validare.\nCând am crescut mai mare\nprin clasele primare\nnu vorbeam cu nimeni niciodată\ncăci consideram că sunt eu mai deșteaptă.\nTot în clasele primare\njucam adevăr sau provocare\nși am fost provocată să\nîmi iau geanta și să plec acasă.\nAm făcut-o bucuroasă,\ncredeam doar că-s prea smart ca să fiu înțeleasă\nde copiii din clasă.\nPe la 12 ani am început să fac poezie\nși credeam că mi se cuvine doar mie\nsă pun cuvinte-n rime pe hârtie.\nO prostie. Fierbeam de gelozie.\nPrin liceu mi-am dat seama\ncă nu-s cea mai frumoasă,\ncă-s cam grasă\nși nici foarte prietenoasă.\n\nȘi atunci am decis\nsă vorbesc mai deschis,\nsă evit profele\nși să merg la cafele,\nsă nu mai fac poezie\npentru că e o prostie,\nsă fiu mai gălăgioasă\nși neserioasă\nca să ascund frica de a fi iar singură\nși cât sunt de nesigură.\nCând am început facultatea\nam cunoscut iar singurătatea,\nm-a cuprins iar insecuritatea\nși am început din nou să scriu.\nDar acum știu,\ncă sunt atât de mulți mai buni ca mine.\nȘi-mi pare bine.\nÎmi place asta.\nChiar mă distrez că ne mai ciondămin\npe insta."},{"title":"Confesiuni 2","body":"Bună, sunt Oana, mama îmi spune și Cristina\nȘi pe la 8 ani susțineam sus și tare\ncă am puteri paranormale,\ncă eu controlez și vânt și soare,\ncă Dumnezeu îmi vorbește\nși că vorbesc și eu proorocește,\ncă sunt un fel de Hristos\npuțin mai frumos.\nȘi pe la 12 ani eram convinsă\ncă Slenderman există\nși așteptam cu nerăbdare\nziua în care\nmă va lua și mă va face slujitoare.\nȘi îmi imaginam\ncă o să ajung ca Jeff the Killer\ncă vor face despre mine un thriller\nși mă gândeam ce frumos va fi\ncând voi ucide alți copii.\nNu-i așa că-i amuzant?\nDa, e și ciudat.\nCred că voiam atenție de fapt.\nȘi încă o fac :)"},{"title":"Cand Te Ineci","body":"Când te îneci\ncel mai îngrozitor\nE că nu aude nimeni\ncum strigi după ajutor.\nȘi partea cea mai rea\ne că te chinui să nu mori\nîn timp ce te zbați și implori\nsă te ajute cineva.\nPoate că asta îmi e soarta\nsă fiu aruncată în ocean\nca Hephaestus de Hera\ncăci s-a născut prea uman.\nCare e meteahna mea?\ncă nu-s cum oamenii ar vrea?\noricât aș încerca\nnu pot mulțumi pe toată lumea."},{"title":"Despre Frica","body":"Un pumn în stomac și un nod în gât.\nMi-e foame dar nu pot să mănânc.\nO mână care îmi apasă pe trahee.\nNu pot să respir, încep să plâng,\nîngrozitoare odisee.\nPupile dilatate și privire pierdută.\nMigrenă și dureri de burtă.\nDe mai mult stres să mă ferească Dumnezeu,\ncă de anxietate stau juma' de zi doar pe veceu.\nTrebuie să fac ceva, dar nu pot muta o ață.\nStau, mă uit la pereți și mă simt paralizată.\nHiperventilez, amețesc și nu mai văd clar.\nE joi la ora 13:42.\nIadul meu personal.\nÎncep să mă închin. Un început de delir.\nTatăl nostru care ești în ceruri\ncare ești în...\ncare...\nTatăl nostru,\nTatăl nostru,\nMă auzi?\nDe ce nu îmi răspunzi?\nNu îți sunt oare și eu fiică?\nNu vezi oare că mi-e frică?\nȘi adorm fără să știu. Și visez cum vreau să fiu."},{"title":"Nu Am Multe Regrete","body":"Nu am multe regrete în viață\n    dar regret\n        în fiecare dimineață\n            că aștept.\nAștept momentul potrivit\n    să ies din zona de confort\n        să spun ce simt\n            să văd cât pot.\nDar nu pot aștepta așa\n    nu mai pot procrastina\n        în speranța\n            că le voi rezolva eu cumva.\nTrebuie să rezolv acum\n    să nu mă mai complac\n        să-mi fac un drum\n            pe care să pot să calc.\nSă calc și să nu cad în gol\n    și să mă gândesc ce bine-mi șade\n        căzând așa domol\n            că doar Dumnezeu alege cine cade."},{"title":"A Fost Odata","body":"A fost odată ca niciodată\nBa nu, a fost\nCândva, nu\nDemult\nEra odată o\nFată.\nGândea prea mult și visa la\nHimere și alte cele\nIar și iar la nesfârșit.\nJelea moartea inspirației și zicea ceva de\nKatabasis și decădere?\nLuați aminte,\nMai degrabă s-ar spune că era\nNebună.\nOh, nebun e un cuvânt mare\nPentru cine știe că se poate scrie poezie fără\n(Quite)\nRime.\nSingură\nȘi fără să știe care e viitorul poeziei\nTăcea și scria și\nȚinea morțiș să scrie ceva\nUnic.\nVocifera doar când era vorba de\nWilliam Shakespeare și poezia secolului al\nXIX-lea.\nYou know what they say\nZâmbește și scrie mai departe."},{"title":"Sunt In Autobuz","body":"Sunt în autobuz.\nȘi un copil zbiară și se zbate\nîn brațele maică-sii,\ndar mă uit la chipul lui mai bine\nși mă văd\npe mine.\nEu ca un nou-născut.\nPe 23 noiembrie 2004\nm-am născut la Spitalul Municipal Onești.\nNingea\nși mami spune că bătea\nclopotul de ora 12\ncând am ieșit din ea.\nCe anecdotic să mă nasc așa.\nCopilul încă urlă și plânge\nși zice: \"Mami vreau bomboane!\" și\n\"Mami vreau pufarine!\" și\n\"Mami...?\nvreau să te uiți la mine.\nSunt consecința propriilor tale acțiuni, mami.\nPentru că am fost velcro baby\nși tu ai fost părinte elicopter și\nmă întreb ce vede fetița din tine\ncând te uiți la mine.\n\nSunt ca păpușa aia mâzgălită pe față\nși cu părul tăiat\npe care ai regretat\ncă ai stricat-o?\"\nSuspină cu sughițuri ăla mic\nși mă-sa-i spune:\n\"Hai să-ți dea mama pupic.\"\nPe la 10 ani, mami\nmi-ai zis\ncă probabil cu Eminescu m-ai făcut\nși poate nu ți-ai dat seama,\ndar de atunci am știut\ncă scrisul meu va trebui să aibă impactul\npe care scrisul lui l-a avut în trecut.\nMama și-a luat copilul în brațe și au coborât\nîn Gemenii.\nEu mai am 3 stații\nși vreau să o sun pe mami.\n\"La examen a fost bine,\nda, am mâncat cu fetele\ncând ajung la apartament trebuie să mai citesc.\nBine, pa, love you.\"\nCă nu putem spune niciuna \"Te iubesc.\""},{"title":"23Nx72Uv","body":"Waisted potential.\nI ask myself:\n\"Could I be any better\nIn other dimension?\"\nI pass the mirror\nAnd I can't\nWatch my own reflection.\nWasted potential.\nI don't even know where am I going\nOr what's the right direction.\nI take my pills,\nI sip my drink,\nBut I can't break the tension.\nWasted potential.\nI crave to be someone,\nI crave to do something,\nIt's a sick obsession.\nWasted potential.\nIf I,\nCan't bring anything meaningful to humanity\nWhy would I struggle to keep living?\nIf I,\nCan't create something new, a transcending creation\nThen it's just...\nWasted potential."},{"title":"3Kf97Ch","body":"Să vă amintiți de mine.\nCând vă veți simți stingheri\nÎn încăperi prea pline.\nSă vă amintiți de mine.\nCând veți plânge ore-n șir\nDin motive infime.\nSă vă amintiți de mine.\nCând orice-ați încerca\nNu vă veți simți bine.\n\nSau nu...\n\nSă vă amintiți de mine\nAtunci când veți citi\nPoezii și romane.\nSă vă amintiți de mine\nÎn zilele ploioase,\nNu în cele senine.\nSă vă amintiți de mine\nAtunci când auziți\nCele mai proaste glume.\nSă vă amintiți de mine\nCa de o poveste\nȘi nu un simplu nume."},{"title":"K39Cg","body":"Când eram mică\nÎmi era frică\nDe întuneric.\nȘi nu am avut pe nimeni care\nSă mă pupe pe frunte\nÎnainte de culcare.\nMereu mi-a lipsit o\nFigură protectoare.\nȘi poate de asta acum\nAm daddy issues\nȘi caut în fiecare bărbat\nCeea ce nu am avut.\nPoate de asta acum\nAm age regression\nȘi noaptea când\nMă pun la somn\nÎncă țin în brațe un pluș.\nCând eram mică\nEram fericită\n\n[REDACTED]\n\nmă iubea."},{"title":"N Am Stiut Niciodata","body":"N-am știut niciodată ce-nseamnă să iubești.\nSă fie doar iubirea ce o știm din povești?\nNu cred...\nPentru că mă uit la tine\nși simt ceva ce n-a mai simțit nimeni.\nSimt...\nCum poți să explici ceva\ncând nimeni nu a mai simțit așa\nși\nnu există cuvinte pentru asta?\nMă simt ca o eclipsă de Soare\ncând Luna pare că-l cuprinde, dar sunt la mile depărtare.\nMă simt ca Orfeu când mai avea\nun pas până să iasă din Infern cu Euridice.\nMă simt ca Iisus Hristos pe cruce,\ncă din infinită iubire a ales să se sacrifice.\nTe iubesc sincer și curat\npentru că m-ai învățat să simt.\nTe iubesc pur și devotat,\npentru că lângă tine uit de timp.\nTe iubesc zelos și necondiționat,\npentru că din nou sper.\nTe iubesc simplu și dezinteresat,\npentru că știu că-i efemer."},{"title":"Jhjhztuw46Escuo","body":"Aș vrea să știu mai puțin\nca să nu mai gândesc așa mult.\nAș vrea să nu mai am gânduri care mă țin\ntrează\nși nu mă lasă să mă culc.\nAș vrea\nca lumea mea\nsă se învârtă în jurul a ceva\nbanal\nși nu în jurul a ce voia să spună\nStendhal.\nAș vrea să nu-l înțeleg pe\nDescartes\nși să nu-l fi citit niciodată.\nAș vrea ca gândirea mea\nsă nu fi fost schimbată\nde Kierkegaard\nși filosofie consacrată.\nAș vrea să uit de Camus și că am citit\ncă trebuie să mi-l imaginez pe Sisif fericit.\nAș vrea să nu mai știu\nși să nu mai fiu conștientă\ncă suntem într-o stare permanentă de\nmoarte latentă\ncă poate așa m-aș bucura de\nviață sau\nnaiba știe ce."},{"title":"Nu Scriu Pentru Oamenii","body":"Nu scriu pentru oamenii\ncare sunt încă vii\nîn viața mea.\nȘi de aceea\nn-am vrut să-ți scriu ție\no poezie.\nDar nu mă pot abține.\nȚi-am spus poate prea des\ncă te iubesc.\nȘi acum mă gândesc,\ndes,\ndacă-ți lipsesc.\nSună prostesc?\nHai\nsă ieșim p-afară.\nHai\nsă ne luăm de la Star\ncâte-o cafea amară.\nHai să ne plimbăm\ncu mașina ta,\nsă ascultăm muzica mea,\nsă mergem în locul ăla\nde care știm doar noi\nși poate aducem ce a fost între noi doi\nînapoi."},{"title":"Early Aripi De Ceara","body":"Mă acoperă cu aripi de ceară\nSe topesc cum lacrimile curg\nE zidul arzător ce mă separă\nDe către demonii care distrug.\n\nDar odată ce aripile i se topesc\nMă va înconjura cu mâinile\nÎmbrățișarea vie pe care o doresc.\nAtât de apropiați, ne vom citi gândurile.\n\nDoar un înger din praf de stele\nÎl venerez;e zeul meu\nApare adesea luminat în visele mele\nÎl voi avea în suflet tablou mereu.\n\nMărul discordiei a fost mușcat\nE imposibil să nu fie un lucru efemer\nIubirea sinceră a unui suflet pătat\nIubesc un înger nemuritor din cer."},{"title":"Early Artista","body":"Simt cum cad tot mai adânc în abis\nMorbid\nMă pierd și mă regăsesc în aceeași gaură de vierme\nInsuportabilă\nGrotească cazarmă a singurătății\nrăzboiului în care mă găsesc.\nToți soldații sunt morți\nEu i-am asasinat, fără grabă\nȘi acum mă lupt cu nimeni alta\nCu subsemnata, artista.\nÎncearcă să controleze teritoriul\nAcesta ar fi mintea mea\n\"Ciudat\", îmi zic\n\"Ciudat\"\nDacă artista scrie poeme\nIar eu o țin departe\nCine sunt eu, scriind acest poem?\nMă lupt cu mine însămi?\nOri cu societatea?\nCu copleșitorul vacarm\nSau cu singurătatea?"},{"title":"Early Copilul Mort","body":"Am plâns privind copilul mort\nAvea privirea înghețată,\nZâmbet rece\nȘi fața vânătă de frig\nDar nu plângea\nDeșii fulgii de nea\nDin cei doi ochi de sticlă\nScăpătau.\n\nAm plâns ținând în palme mâna lui\nUșoară, rece, aspră\nCe nu se mișca\nȘi nu o atingea\nPe-a mea.\n\nAm plâns sărutându-i buzele crăpate\nReci și amare, murdare de sânge\nDar încă tremurânde.\n\nMi-am luat rămas bun\nAșa cum se cuvine\nDe la copilul stins demult\nSpărgând oglinda veche\nBlocând în ea pe veci\nCopilul ce am fost."},{"title":"Early Dansul Iubirii","body":"Dansând pe marginea prăpastiei\nValsul morții și al dragostei\nCădere în abisul infernului\nRidicat de aripile îngerului\nDans în aer printre stele\nIubire în grădina Eden.\n\nSunt aceia Adam și Eva?\nDar oare mai sunt și alți îndrăgostiți?\nMai știe cineva ce e iubirea?\nSau ce ar însemna iubiți?\n\nSe așteaptă în ceasul din urmă minuni\nSă se danseze cu persoana iubită\nTrist că în pașii de dans se spun minciuni\nNu mai este iubire, este ispită."},{"title":"Early Fantasma Din Zapada","body":"Pășeam prin zăpada imaculată\nCând din senin, cam de odată\nO siluetă întunecată\nMi-a intrat în cale.\n\nAvea ochii sticloși, ai zice de mărgăritar\nȘi m-a privit cu o adâncă ură\nM-am simțit brusc vinovat ca o priveam\nAceasta creatură, de o asemenea natură.\n\nViscolul s-a întețit, mă alunga departe\nFantasma nici că dispărea\nTrezea în mine cugetări deșarte\nCe nu aveau să fie nicicând fapte.\n\nO limbă ce nu mi-a fost dat să o cunosc\nMurmura un cântec vechi de dor\nȘi nu intelegeam cuvintele\nNici nu găseam o tălmăcire-a lor\nDar era așa de mlădios și acoperit de jale\nEra sunetul furtunii\nAcoperit de viscol, era o oarecare încântare.\n\nVijelii ce ridicau omătul spre înaltul cerului\nMă împingeau spre obscura fantasma\nCrivățul mă trăgea deoparte\nO tresarire, o presimțire poate\nMa îndemnat să plec deodat' departe.\n\nAlea iacta est, nu am urmat nici o suflare\nNu am urmat vijelia,\nNici crivățului nu am dat ascultare\nCrispată, fantasma mă privea\nȘi trupul său cel zvelt în umbre dispărea.\n\nFugind ca disperat, m-am prins de brațul ei\nȘi ceva din privirea înghețată ce mi-a dat-o\nMa făcut să înțeleg, ca era acolo pentru mine\nIar eu am alungat-o.\n\nFiința efemeră, ma lăsat pustiu\nCăci stau în intuneric și intuneric sunt\nOmătu-i rece, dureros, dar găsesc alinare\nIn această poveste, nu-s eu fantasma oare?"},{"title":"Early Galbenul De Septembrie","body":"Și dintre toate culorile aprinse\nMă înec în galbenul de septembrie\nÎn adierile răcoroase și fine\nCe aduc parfumul anilor trecuți.\n\nȘi dintre toți anii trecuți\nÎmi amintesc de toamna lui '98\nDe serile pierdute-n Cișmigiu\nCe-mi răscoleau emoțiile.\n\nȘi dintre toate emoțiile\nAleg iubirea pură și vibrantă\nÎntâia dragoste copilărească\nPrima despărțire brutală.\n\nȘi dintre toate despărțirile\nCea mai dureroasă a fost ultima\nCând vântul ce adia rece și fin\nLua cu sine parfumul tău amețitor."},{"title":"Early Gandesc Fantasmagoric","body":"Gândesc fantasmagoric\nȘi sunetul înfundat al clopotelor\nce bat\n12 pm să anunțe\nMă induc în visare\nȘi ce lume utopică văd.\n\nErau oameni\nOh! Oamenii! Oamenii!\nAlergau ca apucați, toți îmbrăcați la fel\nCu pelerina galbenă și servieta transparentă\nAlergau și călcau direct în bălți, desculți\nCu zâmbete nebune petrecute pe chip.\n\nȘi eu eram nebunul\nCăci în mulțimea de capete galbene si fericite\nEu eram suflet pierdut;\nDegeaba aveau cu toții zâmbete nebune\nEu fiind singur, ud, fără de zâmbet\nIeșeam din normalitatea utopista a lumii perpetue-\ndin visul meu identificat ca și coșmar\nȘi m-am trezit când clopotul mic,\nAnunță cu sunet sec\nOra 5."},{"title":"Early Icar","body":"De ce ți-ai făcut aripi de ceară, Icar?\nTu nu știai oare că mori?\nTe-ai bucurat tu oare doar\nc-ai reușit să zbori?\n\nProbabil că te-ai visat Zeu.\nAi visat că poți zbura,\ndar vezi tu, dragul meu...\nZborul ți-a adus pieirea.\n\nAripile se capătă, să știi,\nși nu le poți avea tu pe nedrept\n\"Ce-au făcut Zeii\", te-ntrebi\nS-au născut fără defect.\n\nTu, om hain, nebun cu firea\nÎndrăgostit nebun de viață\nChiar ai crezut că poți fi Zeu?\nÎn suflet ai avut speranță?\n\nIcar, tu nu ești Zeu,\nnu ai fost niciodată.\nEști doar un simplu muritor\nCe a avut speranță."},{"title":"Early In Umbre Ma Pierd","body":"În umbre mă pierd total paradoxal\nÎn neguri mă descopăr într-un final\nSa-mi spună cineva de ce nu vad culorile\nDe ce vad negru când privesc trist zorile.\n\nGăsesc alinare în dulcele negru-ndoliat\nCoșmaru-n care sufăr pare-adevarat\nRătăcesc pe căi pustii fără a știi a iubi\nCăutând defapt a iubi a-mi aminti.\n\nSunt în contradicție cu mine însumi\nCăci neștiutor caut răspunsuri\nO fantomă moartă ce vie nu a fost\nÎn van spun că în sumbritate eu ma bucur\nLumina vreau să o cunosc, să uit trecutul.\n\nCe trecut e de uitat când nu a existat?\nSunt o ființă translucidă\nStând pe Ceres privesc soarele aici uitat\nUitat-am și eu să fiu viu și inima-mi\nmurindă.\n\nTotuși amintiri răzlețe imi dau fiori\nParcă din altă viață de-aș avea\nPriveam pierdut cumva printre nori\nDe unde știu eu ce sunt aceia?\n\nDe unde știu că unul sunt?\nȘi dacă nu aș fi, al cui e acest gând?\nNu cunosc nimic și tot mi-e cunoscut\nEu sunt nimeni și totuși sunt mai mult."},{"title":"Early Lacul Padurii De Argint","body":"Lacul Pădurii de Argint e înghețat\nDar încă îmi pot zări portretul\nUn anonim, singur și trist, poetul\nCe-și privește chipul încruntat.\n\n\"Ce am ajuns, ce am ajuns?\"\nÎngână fața oglindită\n\"Un vis\", șoptește parcă neclintită\n\"Un vis piedut în timpul scurs.\"\n\nE frig, o pot simți în piele\nDar mai înghețat mi-e sufletul\nCu-n strat de gheață fin, dar dur\nȘi-am lacrimi înghețate precum stele.\n\n\"Ce-mi încălzește inima?\"\nDar cine să-mi răspundă?\nȘi totuși se aude o voce plăpândă\n\"Poezia este alinarea mea.\""},{"title":"Early Lilith","body":"Oh, cum atragi tu suflete\nTu ispită pentru sinele interior\nPătezi conștiința cu dorință și dor\nOferi falsă iubire pentru adevărate scâncete.\n\nTu prinzi în dansul minciunii\nOrice ființă, orice suflare\nSpre tine, cu flăcări în ochi si-n plină turbare\nSuflete vin să danseze sub clarul lunii.\n\nÎn mijloc de noapte albă ca perla\nFugi, zâmbind tu hoață de iubire\nSufletul rupt face trupul să uite să respire\nAi omorât furând de la o viață dragostea."},{"title":"Early Pacatele","body":"Iartă-mă părinte, pentru că am păcătuit!\nNu mă uit în ochii domniei tale, căci mi-e rușine\nAm făcut păcate, din cele mai murdare\nȘi mă căiesc.\n\nAm lăsat prea puține păcate negustate!\nAm blestemat...\nAm râvnit la boul vecinului\nL-am furat și mâncat.\nE un păcat de moarte\nUnul din cele șapte\nȘi mă căiesc.\n\nPoate sângele mielului să imi spele păcatul?\nMă mândresc...\nÎmi curge fala prin vene\nMă văd deasupra lumii\nE un păcat de moarte\nUnul din cele șapte\nși mă căiesc.\n\nNu mă cunosc, părinte, nu mă iubesc!\nUrăsc...\nDisprețuiesc aproapele\nNu ajut săracii ori bolnavii\nE un păcat de moarte\nUnul din cele șapte\nȘi mă căiesc.\n\nExistă păcat ce nu poate fi iertat?\nLenevesc...\nPășesc în biserică doar căutând iertare\nȘi fără să vreau nu aduc slavă Domnului\nE un păcat de moarte\nUnu din cele șapte\nȘi mă căiesc.\n\nMă simt prizonieră, în lumea asta a noastră!\nSunt avară...\nAdun banii și-i ascund\nȘi nu dau din puținul meu și altuia\nE un păcat de moarte\nUnul din cele șapte\nȘi mă căiesc.\n\nNu am vrut, părinte, să ajung așa!\nSunt desfrânată...\nÎmi hrănesc inima cu frumuseți străine\nSi am iubit oameni, mai mult decât pe Domnul\nE un păcat de moarte\nUnul din cele șapte\nȘi mă căiesc.\n\nCaut împăcare, părinte! Caut fericirea!\nSunt mânioasă...\nRăzbunarea mi-e armă\nUrlu, lovesc și denigrez pe cel ce m-a mâniat\nE un păcat de moarte\nUnul din cele șapte\nȘi mă căiesc.\n\nPărinte, te rog, iartă-mă!\nRoagă-te pentru sufletul meu murdar!\nAm lăsat vorbele șarpelui mișel în mintea mea\nRegret părinte!\nSă audă îngerii, serafimii și cei mai sus de ei!\nCaut iertare!\nSunt pierdută, părinte!\nAm alunecat în întuneric, dar mă căiesc."},{"title":"Early Papusi De Portelan","body":"Păpuși de porțelan, toate de calitate\nCele cu ochii azurii în stânga\nCele în rochii de mătase ocupă centrul\nIar în dreapta sunt cele cu păr auriu\nDar cele deformate?\nCele cu o mână lipsă ori mai scunde\nCele defecte din fabricație, cele hâde\nUnde trebuie puse?\nPatronul fabricii râde, ținând în mâna-i mare\nO păpușă mică, cu trunchiul deformat\nUnde trebuie puse? Hazlie întrebare!\nCele nereușite, nu-și au un loc anume\nCi vor fi zdrobite, fără de răgaz\nIar din rămășițe, vom reface păpușa\nAșa cum trebuie să fie ori și care.\nDe nu e cu putință, se înțelege dară\nCă materialul, e unul prost făcut\nE o ieftinătură și trebuie să dispară\nCăci un rezultat prost, nu este unul vrut.\nPăpușa cu-n defect, oricât de mic îți pare\nNu este apreciată și trebuie ascunsă\nDe nu o poți ascunde, defectul e prea mare\nȘi creația hâdă, trebuie distrusă."},{"title":"Early Ploua","body":"Ploua.\nPicuri se izbeau violent de pământ\nSe prelingeau prin părul încâlcit\nMascau lacrimile oricum uscate de vânt\nLacrimi ce anunță teama de sfârșit.\nSteaguri roșii, pătate cu sânge de erou\nErau plecate la pământ, plângând\nÎși plângeau luptătorii, ce au pierit demn\nVise deșarte, cu dorință apărând.\nLuptând pentru viață mea, doar una am,\nMi-am amintit de mama si de sfaturile sale\nEram un copil ce spera,vise și dorinte-aveam\nAcum lupt pentru viață, dar de fapt vreau onoare.\nPoate aș ajunge doar un nume pe o piatră funerară\nAmintit ca un soldat viteaz și demn\nCe a murit doar pentru dragostea de țară\nAșa cum ar fi scris pe cruce, pe o tăbliță de lemn."},{"title":"Early Regina Lumii","body":"Regele stelelor, o tu rege,\nRidică-mă din infern\nTimpul e înghețat si rece\nSalvum me din frigul etern.\n\nZamolxis suprem tată\nSalvează a ta fată\nScoate-mă din umbră\nDu-ma la Geea maica blândă.\n\nIlúvatar ceresc creator\nPrivește-mă ridicată din durere\nCăci nu accept să mor\nSi iată eu nu voi avea cădere.\n\nElfii să se plece înaintea mea\nSemizeii plângă, căci Zeus a căzut\nPandora însăși mi-a oferit cutia sa\nCe am deschis-o in Olimpul acum mut.\n\nAm distrus Olimpul\nAm fărâmat Andromeda\nAm doborât Edenul\nȘi Iadu-n care-a zăcut Eva.\n\nInlănțuită ca si Cronos\nAdânc jos în Tartar\nV-am folosit pe toți\nMi-ați facut și altar.\n\nAm baut sângele elfului nemuritor\nI-am folosit mintea zeului murdar\nCu aripi de Pheonix m-am ridicat in zbor\nAm folosit timpul lui Cronos, ce l-am primit in dar.\n\nDeus e doar nume\nUitat de timp si soartă\nPuterea e la mine\nLumea e destramata.\n\nVoi recrea eu Iurra\nCaci l-am distrus zâmbind\nVoi reface natura\nZeii doar mulțumind.\n\nPuterea supremă o am in mana\nSteaua Polaris în a mea cunună\nElfii si nimfele ma numesc stăpână\nSunt Regina de sub clar de lună.\n\nIn abis Ilúvatar, Cronos si Zeus\nPuterea si-o adună,\nZamolxis, Geea si Uranus\nCu toții împreună\nEi vin sa ma doboare\nSă refaca pamantul\nRegina Lumii moare\nÎn slavă-ncepe cântul.\n\nPuterile-adunate\nDe elfi de zei de zane\nCrează ce-i aparte\nUn nou rege în lume.\nDios născut doar din putere\nVa guverna-ntreg timpul\nVa scoate Terra din durere\nȘi va crea iubitul.\n\nRegină moartă a durerii\nPrivesc schimbarea lumii\nDin lumea învierii\n\"Nimic\" îl numesc unii.\n\nVoi dainui aici\nSi voi privi discret\nVoi oferi lumii frici\nTot voi distruge încet.\n\nSub tot binele vieții\nE o pată de rău\nȘi stiu ei zeii bieții\nCa tot răul sunt eu."},{"title":"Early Seara De August","body":"Ne-am cunoscut într-o seară de August\nDoamne, cât de frumoasă putea fi\nParcă o văd și acum, în fața mea,\nÎn rochia neagră, zâmbind blajin.\n\nNe-am cunoscut înainte de apus,\nEu doar un copil, ea deja femeie,\nAm privit căderea soarelui,\nAm vorbit despre semnificația vieții.\n\nNe-am cunoscut înainte de a ne naște,\nȘi când ne-am văzut n-am știut că o cunosc\nEa m-a recunoscut, abia acum realizez\nDar eram doar un copil, de ce nu a mărturisit?\n\nAcum e iar în fața mea, avem aceeași vârstă\nE neschimbată, poate puțin mai palidă,\nDar e tot ea, dar sunt tot eu,\nSuntem ambele personalități ale unei minți.\n\nÎmpărțim în egală măsură controlul acum,\nȘi ne jucăm mereu în mintea asta asa naivă.\nUite acum, uite păpușa, face ce îi comandăm,\nAțele sunt aproape rupte, dar face tot ce vrem.\n\nAcum râde, ba nu, plânge, e confuză\nAcum își sfâșie pielea, acum caută bandaje\nAcum urlă, acum tace, adoarme iar și iar\nPăpușica noastră încearcă în zadar să scape."},{"title":"Early Sentimente Puternice","body":"Sentimente puternice\nAr fi regret? Dar ar fi ură?\nAr fi atingerea vântului fin de iunie\nCe ne îmbrățișează distant.\n\nIar pe marginea lacului netulburat\nNe bucurăm de lunga noastră plimbare\nAcompaniați de serenadele întunericului.\n\nNoaptea obișnuia să mă sperie\nDar privindu-ții ochii luminoși\nCalea mea este clară\nIar scopul neclintit.\n\nObscuritatea te-amuțește mi se pare\nCăci țipetele zilei trecute\nSunt înlocuite de șoapte drăgăstoase.\n\nNe dezîndragostim\nDar în umbra nopții ne iubim\nSă fim noi oare\nAmorezii prinși\nÎn jocul de șah\nAl nebuniei?"},{"title":"Early Spitalul 9","body":"Sorb cu poftă din paharul vieții\nLicoarea aromată cu sânge și venin\nStând pe tronul meu de oase\nÎnțeleptul mag îmi spune ce să fac.\n\nVocea-i mieroasă șoptește amețitoare\nȘi cuvintele-i alese m-amețesc\nZâmbesc când îi aud ideile mărețe\nÎn care eu sunt stăpânul gândurilor.\n\n\"În clopotniță poate\", sugerează gânditor\nIar planul genial nou născocit îmi place\nCăci e dovada, dovada vie\nDovada că sunt biruitorul imposibilului.\n\nNu știu cum am urcat-dar entuziasmat\nPriveam de sus mulțimea de supuși\nCe șoc celest îi va cuprinde când vor vedea\nVor vedea cum mă înalț în zbor ca îngerii.\n\nPășesc în gol, mândru de puterea mea\nDar mă cuprinde spaima, căci cerurile se ridică\nIar slujitorii mă privesc acum înspăimântați\nDar pot auzi râsul drăcesc al magului trufaș.\n\n\"Era internat de zece luni, se agrava\"\nDeclară medicul de gardă de la Spitalul 9\n\"A sărit în gol de la etajul 4, a murit\"\nȘah mat pentru regele nebunilor."},{"title":"Early Sunt Normal","body":"Soarele își izbeste razele de fereastra îngustă\nlumina-i augustă mă-ndeamnă la păcat\ncă nu-s bogat și duhu'-i sărac\nși nu mă complac, displac,\nsă trăiesc în sărăcia lucie, intelectuală.\nNu că ar fi prima oară, prima clipă amară.\nBunăoară,\nintelectul m-a-nșelat, repetat\nStângaci, crezându-mă deștept,\ndar sunt infect, imperfect\nCe defect!\nnu are geniul meu nici-un efect.\nE în van, mortuar, a-nțelege că-s mirean,\nchiar uman,\nprea banal.\nSunt normal."},{"title":"Early Tot Ce Ador","body":"Tot ce ador\nSă simt, să mor\nDispare-ncet\nÎn pași de menuet\nSau dispar eu\nȘi nu mai simt\nȘi trec prin timp\nȘi reînviu\nȘi retrăiesc\nȘi reapar\nCu chip amar\nÎn mintea ta\nȘi în ființă\nȘi-n credință\nCa dorință.\n\nCum te ador\nTe adoram\nȘi tot te voi\nPrinși între lumi\nSuntem doar noi\nFiințe vii\nCu inimi moi."},{"title":"Early Utopia","body":"E perfect, în Utopia\nAtât de perfect, încât e anormal\nȘi în dorința de a simti normalitate\nObservi ca perfecțiunea e o minciună.\n\nE liniște în Utopia\nAtât de silențios, încât nici vântul nu bate\nȘi aceasta din cauză că țipetele cele mari\nSunt în minte locuitorilor amuțiți.\n\nE veselie, în Utopia\nAtâta veselie, încât locuitorii zâmbesc într-una\nȘi asta deoarece plâng noaptea\nAscunși în pătura de întuneric.\n\nUtopia nu e nimic altceva decât o minciună\nAtât de falsă încât o complacem și trăim în ea\nUtopia e în fiecare cămin al lumii\nȘi așteaptă să fie demascată."},{"title":"Early Vulgar","body":"văd dorința în privire\nvăd pofta feroce din ochii muritorilor\nvăd gelozia din ochii pandorei\ncând zâmbesc zeflemitor.\n\nsunt o zeiță\ncreată de mâinile afroditei și sabia lui ares\nsunt cel mai letal păcat\nma numesc vulgaritate.\n\nsunt iubirea violentă\nobsesia nebunilor îndrăgostiți de viață\nsunt junghiul din inimă\ncare sucește mințile.\n\nsunt soră cu eros și agape\ndar am în mine venin, ură și mândrie\niubesc și violent și blând\napoi ucid."}]</script>

function palette(n){

  pv={st:"out",t0:performance.now(),A:520*k,B:640*k,Dd:240*k,homeAt:1180*k,end:1480*k};
  try{if(document.activeElement&&pvEl.contains(document.activeElement))document.activeElement.blur()}catch(e){}
  try{bell(PENTA[3],0,.07,1.4)}catch(e){}
}
function aTap(){
  const now=performance.now();aTaps=aTaps.filter(s=>now-s<2200);aTaps.push(now);
  if(aTaps.length<3||cam.st!=="off"||face.on||pv.st!=="off")return;
  aTaps=[];deer.taps=[];enterPoems("dissolve");
}
// particles of the dissolve, drawn on the word layer behind the poems text
function drawDust(){
  if(pv.st!=="in"&&pv.st!=="out")return;
  const now=performance.now(),age=now-pv.t0,th=THEMES[cur];
  if(pv.st==="in"&&!pv.shown&&age>=pv.showAt){pv.shown=true;pvShow()}
  if(pv.st==="out"&&!pv.home&&age>=pv.homeAt){pv.home=true;hideWord=false;pvEl.hidden=true;pvEl.inert=true;reboots.push({x:cols/2|0,y:rows/2|0,t0:t-60})}
  if(age>=pv.end){if(pv.st==="in")pv={st:"on"};else{pv={st:"off"};pvEl.hidden=true;pvEl.inert=true;hideWord=false}dust=[];return}
  const fadeAt=pv.st==="in"?pv.showAt:pv.homeAt,fade=1-clamp((age-fadeAt)/(pv.end-fadeAt),0,1);
  ctx.textBaseline="top";let lastF="";
  for(const p of dust){
    const ua=clamp(age/pv.A,0,1),ea=1-Math.pow(1-ua,3);
    let x=p.sx+p.vx*ea,y=p.sy+p.vy*ea;
    const ub=clamp((age-pv.A*.7-p.d*pv.Dd)/pv.B,0,1),eb=eio(ub),sw=Math.sin(ub*Math.PI)*p.sw;
    x+=(p.tx-x)*eb+sw;y+=(p.ty-y)*eb;
    const sz=Math.max(4,p.ss+(p.ts-p.ss)*eb),f=Math.round(sz)+"px ui-monospace,Menlo,Consolas,monospace";
    const chr=ub>.88?p.tc:(ua<.12?p.sc:(Math.random()<.35||!p.cur?(p.cur=rj()):p.cur));
    let a=Math.min(1,.25+ua*1.2)*fade*(p.extra?1-eb:1);if(a<.01)continue;
    if(f!==lastF){ctx.font=f;lastF=f}
    ctx.fillStyle=`hsl(${(th.h+th.a*(p.hue*2-1)+pvHue+360)%360} ${th.s?Math.round(55+40*(1-eb)):0}% ${Math.round(66+20*eb)}% / ${a.toFixed(3)})`;
    ctx.fillText(chr,x,y);
  }
  ctx.font=`bold ${cell*1.45}px ui-monospace,Menlo,Consolas,monospace`;
}
addEventListener("pagehide",()=>{if(pv.st==="on")pvSave()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&pv.st==="on")pvSave()});
build();try{const s0=pvLoad();if(s0&&s0.view==="poems"){hideWord=true;requestAnimationFrame(()=>enterPoems("reveal"))}}catch(e){}
_w=Math.round(window.visualViewport?visualViewport.width:innerWidth);_h=Math.round(Math.max(window.visualViewport?visualViewport.height:0,innerHeight));requestAnimationFrame(loop);
