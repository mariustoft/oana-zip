    return{x0:x0,x1:x1,y0:y0,y1:y1,w:x1-x0+1,h:y1-y0+1}};
  octx.font=f(fs);
  fs*=Math.min(1,maxw/(octx.measureText(TXT).width*X),maxh/(fs*1.1));

function build(){

function themeAt(c,r){

    AC=new C();master=AC.createGain();master.gain.value=.12;master.connect(AC.destination);bus=master;
    try{ // soft room reverb made from decaying noise, so everything sounds spacious and not synthetic

function unlockAudio(){try{const a=audio();if(a&&a.state==="suspended"&&a.resume)a.resume().catch(function(){})}catch(e){}}

function tone(f,d,type,to,vol,delay,att,lp){try{

  if(!ok())return;

// ---------- random letter colours ----------
function palette(n){
  const base=Math.random()*360,kind=Math.random()*4|0,out=[];
  for(let i=0;i<n;i++){
    let h;
    if(kind===0)h=base+i*(300/n);                 // full rainbow sweep
    else if(kind===1)h=base+(i%2?180:0)+i*9;       // complementary pair
    else if(kind===2)h=base+(i%3)*120+i*6;         // triad

  }

  // new theme wipes outward from the click
  if(wipe)cur=wipe.to;
  let to;do{to=Math.random()*THEMES.length|0}while(to===cur);
  wipe={x,y,t0:t,from:cur,to};
  // pick next effect from a shuffled bag so they don't repeat
  if(!bag.length){bag=NAMES.slice().sort(()=>Math.random()-.5);if(bag[bag.length-1]===last)bag.reverse()}
  last=bag.pop();FX[last](x,y);
  try{if(!quiet){unlockAudio();if(SFX[last])SFX[last]();SFX.tick();buzz(BUZZ[last])}}catch(e){}
  silent=false;
  if(!quiet){fontIn--;if(fontIn<=0){fontIn=3+(Math.random()*3|0);try{let n2;do{n2=Math.random()*STY.length|0}while(n2===sty);sty=n2;glyphs(sty);drips=[]}catch(e){}}}
  // click counter: milestones and combos
  if(!quiet){
    clicks++;combo=(t-lastClick<32)?combo+1:1;lastClick=t;
    try{
      if(clicks%5===0){const others=NAMES.filter(function(n){return n!==last});const n2=others[Math.random()*others.length|0];FX[n2](x,y);if(SFX[n2])SFX[n2]()}
      if(clicks%10===0){finale(clientX,clientY)}
      if(clicks===25||clicks%50===0){supernova(x,y)}
      if(clicks===100||clicks%200===0){rainbow=720;buzz([30,40,30,40,30,40,200])}
      if(combo>=8&&combo%4===0){FX.glitchstorm(x,y);if(SFX.glitchstorm)SFX.glitchstorm();buzz([8,10,8,10,8,10,8,10])}
    }catch(e){}
  }
  // small sparkle burst on every click, bigger when you tap fast
  for(let i=0;i<18+Math.min(combo,15)*4;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    parts.push({x:clientX,y:clientY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.03,life:30+Math.random()*30,max:60,ch:rj(),hue:Math.random()})}
}
// ---------- main loop ----------
function frame(){
  t++;
  if(!motionLive){tgtX=px>-900?clamp((px/W-.5)*2,-1,1):0;tgtY=py>-900?clamp((py/H-.5)*2,-1,1):0}
  tiltX+=(tgtX-tiltX)*.08;tiltY+=(tgtY-tiltY)*.08;
  if(RM){shake=0;flash=Math.min(flash,.06);invert=0}
  if(t-lastInput>60*25&&(t-lastInput)%(60*12)===0){fire(Math.random()*W,Math.random()*H,true)}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#060608";ctx.fillRect(0,0,W,H);
  if(shake>0){shake*=.9;if(shake<.3)shake=0;ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
  ctx.font=`bold ${cell*1.45}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textBaseline="top";
  if(wipe&&(t-wipe.t0)*2.6>Math.hypot(cols,rows*1.6)){cur=wipe.to;wipe=null}
  waves=waves.filter(w=>t-w.t0<110);reboots=reboots.filter(r=>t-r.t0<130);
  if(rainbow>0)rainbow--;
  rainBoost*=.985;if(rainBoost<.02)rainBoost=0;
  if(glitch>0){glitch--;if(glitch%3==0){for(let k=0;k<5;k++)tear[Math.random()*rows|0]=(Math.random()-.5)*16}}
  else{for(let r=0;r<rows;r++)tear[r]=0;if(--nextGlitch<=0){glitch=14;nextGlitch=420+Math.random()*520}}
  const g=glitch>0;
  const cyc=(t%900)/900,bandX=-.2*cols+cyc*1.4*cols;
  const mx=px/cell,my=py/ch;
  const decode=Math.min(1,t/110);
  // ---- matrix rain (themed) ----
  for(let c=0;c<cols;c++){
    const d=rain[c];if(!d.on){if(Math.random()<.004+rainBoost*.05){d.on=true;d.y=-d.len}continue}
    d.y+=d.v*(1+rainBoost*5);
    const len=d.len+(rainBoost*14|0);
    for(let j=0;j<len;j++){
      const rr=Math.floor(d.y)-j;if(rr<0||rr>=rows)continue;
      if(mask[rr*cols+c]>.15)continue;
      const f=1-j/len,th=themeAt(c,rr);
      ctx.fillStyle=j==0?`hsl(${th.rh} ${th.s?60:0}% 88% / ${.55+rainBoost*.4})`:`hsl(${th.rh} ${th.s?100:0}% 58% / ${(.04+.2*f*f)*(1+rainBoost*1.6)})`;
      ctx.fillText(JUNK[(c*7+rr*3+(t>>3)*(j+1))%JUNK.length],c*cell-tiltX*cell*2.2+(rr-rows/2)*tiltX*cell*.22,rr*ch-tiltY*ch*.6);
    }
    if(d.y-len>rows){d.y=-Math.random()*20;d.v=.12+Math.random()*.3;d.len=6+Math.random()*16|0;d.on=Math.random()<.7}
  }
  // soft glow of the word shape underneath, makes it readable
  try{ctx.globalAlpha=.9;ctx.drawImage(back,tiltX*cell*2.2,tiltY*ch*.8,W,H);ctx.globalAlpha=1}catch(e){}
  // ---- letters + background ----
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const i=r*cols+c,m=mask[i];
      // wave rings (apply to all cells)
      let ring=0;
      for(let k=0;k<waves.length;k++){const w=waves[k],age=t-w.t0;if(age<0)continue;
        const dd=Math.hypot(c-w.x,(r-w.y)*1.6),rad=age*1.5,x=(dd-rad)/3;
        ring+=Math.exp(-x*x)*(1-age/110)}
      if(m<.15){
        const n=hash(c,r);
        if(ring>.18){const th=themeAt(c,r);ctx.fillStyle=`hsl(${th.h+th.a*Math.sin(c*.1)} ${th.s}% 66% / ${Math.min(.95,ring*.9)})`;ctx.fillText(rj(),c*cell,r*ch);continue}
        if(n>.955){
          const a=.07+.16*Math.abs(Math.sin(t*.012+n*60));
          ctx.fillStyle=`rgba(140,130,200,${a})`;
          ctx.fillText(JUNK[(n*977|0)%JUNK.length],c*cell,r*ch);
        }
        continue;
      }
      const th=themeAt(c,r);
      // reboot: letters scramble, then decode outward from the click
      let scr=false;
      for(let k=0;k<reboots.length;k++){const b=reboots[k],age=t-b.t0,dd=Math.hypot(c-b.x,(r-b.y)*1.6);
        if(age<125&&dd>(age-8)*1.9)scr=true}
      const resolved=c/cols<decode*1.15-.1;
      if(!resolved||scr){ctx.fillStyle=`hsl(${th.h} ${th.s?60:0}% 75% / .55)`;ctx.fillText(rj(),c*cell,r*ch);continue}
      
      let chr=chars[i];
      const dist=Math.hypot(c-mx,(r-my)*1.6),near=dist<8?1-dist/8:0;
      if(near>0&&Math.random()<near*.6)chr=rj();
      if(ring>.3&&Math.random()<ring)chr=rj();
      const band=Math.max(0,1-Math.abs(c-bandX)/7);
      const hue=(th.h+th.a*Math.sin(c*.035+r*.03+t*.006)+tiltX*28+360)%360;
      let light=Math.min(97,th.l+(edge[i]?26:6)+band*22+near*16+ring*30),hue2=hue,sat2=th.s;
      if(ov){const age=t-ov.t0;if(age<ov.dur){
        const L=lid[c];
        let h=ov.hues[L<0?0:L%ov.hues.length];
        if(age<ov.cascade&&((age/5|0)+L)%3===0)h=(h+(hash(L,age/5|0)*360))%360; // quick colour shuffle before it settles
        hue2=(h+Math.sin(r*.12+c*.05)*10+360)%360;sat2=ov.sat;
        light=Math.min(96,ov.lit+band*26+near*16+ring*30-Math.max(0,(age-ov.dur+90)/90)*0);
      }else ov=null}
      if(rainbow>0){hue2=(t*2.6+c*3+r*1.5)%360;sat2=92;light=Math.min(94,64+band*20)}
      let x=c*cell+tear[r]+tiltX*cell*2.2+(r-rows/2)*tiltX*cell*.2,y=r*ch+tiltY*ch*.8+near*Math.sin(t*.2+c)*2+ring*Math.sin(t*.5+c)*3;
      if(g){
        ctx.globalCompositeOperation="lighter";
        ctx.fillStyle="rgba(255,40,210,.8)";ctx.fillText(chr,x-4,y);
        ctx.fillStyle="rgba(0,230,255,.8)";ctx.fillText(chr,x+4,y);
        ctx.globalCompositeOperation="source-over";
      }
      ctx.fillStyle=`hsl(${hue2} ${sat2}% ${light}%)`;
      ctx.fillText(chr,x,y);
      if(Math.random()<.00012&&(r+1>=rows||mask[i+cols]<.15))drips.push({c,r:r+1,len:4+Math.random()*10|0,hue,age:0});
    }
  }
  // ---- drips ----
  for(let k=drips.length-1;k>=0;k--){
    const d=drips[k];d.age++;
    const head=d.r+d.age*.08;
    for(let j=0;j<d.len;j++){
      const rr=head-j;if(rr<0||rr>=rows)continue;
      ctx.fillStyle=`hsl(${d.hue} 85% 60% / ${1-j/d.len})`;
      ctx.fillText(JUNK[(d.c+j+(d.age>>3))%JUNK.length],d.c*cell,rr*ch);
    }
    if(head-d.len>rows)drips.splice(k,1);
  }
  // ---- lightning ----
  for(let k=bolts.length-1;k>=0;k--){
    const b=bolts[k],age=t-b.t0;if(age>22){bolts.splice(k,1);continue}
    const a=1-age/22;
    ctx.shadowColor="#9ff";ctx.shadowBlur=b.thin?0:14*a;
    ctx.fillStyle=b.thin?`rgba(160,230,255,${a*.7})`:`rgba(235,250,255,${a})`;
    for(let j=0;j<b.pts.length;j++){const p=b.pts[j],q=b.pts[j+1];
      const sym=q?(q[0]>p[0]+2?"\\":q[0]<p[0]-2?"/":"|"):"*";
      ctx.fillText(Math.random()<.15?rj():sym,p[0],p[1]);
      if(!b.thin&&Math.random()<.4){ctx.fillText(sym,p[0]+cell,p[1]);ctx.fillText(sym,p[0]-cell,p[1])}}
    ctx.shadowBlur=0;
  }
  // ---- particles ----
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k];p.life--;if(p.life<=0){parts.splice(k,1);continue}
    p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;
    if(Math.random()<.1)p.ch=rj();
    const th=THEMES[cur],a=p.life/p.max;
    ctx.fillStyle=`hsl(${(th.h+th.a*(p.hue*2-1)+360)%360} ${th.s?95:0}% ${60+a*30}% / ${Math.min(1,a*1.6)})`;
    ctx.fillText(p.ch,p.x,p.y);
  }
  // ---- soft scanlines ----
  ctx.fillStyle="rgba(0,0,0,.18)";
  for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
  // ---- full-screen flash / invert ----
  if(flash>0.01){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);flash*=.8}
  if(invert>0){invert--;const p=1-invert/26;ctx.globalCompositeOperation="difference";
    ctx.fillStyle=`rgba(255,255,255,${Math.sin(Math.PI*p)})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="source-over"}
}
function loop(){try{frame()}catch(e){}requestAnimationFrame(loop)}
// ---------- input ----------
addEventListener("pointermove",e=>{px=e.clientX;py=e.clientY;lastInput=t;if(hold&&Math.hypot(px-hx,py-hy)>14){clearTimeout(hold);hold=null}
  
  if(e.buttons){for(let i=0;i<2;i++)parts.push({x:px+(Math.random()-.5)*10,y:py+(Math.random()-.5)*10,vx:(Math.random()-.5)*2,vy:Math.random()*-1.5,g:.03,life:35,max:35,ch:rj(),hue:Math.random()})}});
let hold=null,hx=0,hy=0;
function finale(x,y){
  try{unlockAudio();silent=false;
    FX.shockwave(x/cell|0,y/ch|0);FX.explode(x/cell|0,y/ch|0);FX.lightning(x/cell|0,y/ch|0);
    SFX.explode();SFX.colors();noise(1.2,.4,200,2800,0,"bandpass",.7);buzz([40,30,80,30,140,30,220])}catch(e){}
}
addEventListener("pointerdown",e=>{px=e.clientX;py=e.clientY;lastInput=t;fire(e.clientX,e.clientY);
  hx=px;hy=py;clearTimeout(hold);hold=setTimeout(()=>{finale(hx,hy);hold=null},700)});
addEventListener("pointerup",()=>{clearTimeout(hold);hold=null});
addEventListener("pointercancel",()=>{clearTimeout(hold);hold=null});
addEventListener("pointerleave",()=>{px=py=-999});
addEventListener("keydown",e=>{if(e.repeat||e.metaKey||e.ctrlKey)return;lastInput=t;
  if(e.key==="m"||e.key==="M"){muted=!muted;return}
  fire(Math.random()*W,Math.random()*H)});
let _w=0,_h=0;
function fit(){const vv=window.visualViewport,w=Math.round(vv?vv.width:innerWidth),h=Math.round(Math.max(vv?vv.height:0,innerHeight));
  if(w!==_w||h!==_h){_w=w;_h=h;const keep=t;build();t=Math.max(keep,110)}}
addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,200));
if(window.visualViewport)visualViewport.addEventListener("resize",fit);
setInterval(fit,400);
addEventListener("scroll",()=>scrollTo(0,0));
build();_w=Math.round(window.visualViewport?visualViewport.width:innerWidth);_h=Math.round(Math.max(window.visualViewport?visualViewport.height:0,innerHeight));requestAnimationFrame(loop);
</script>
</body>
